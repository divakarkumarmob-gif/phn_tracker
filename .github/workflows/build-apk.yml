name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Phone Tracker APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 4. Ensure google-services.json is Configured
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Injecting google-services.json from GitHub Secrets..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          else
            echo "Using default repository google-services.json"
          fi

      - name: 5. Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: 6. Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 7. Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 8. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneTracker-Debug-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: 9. Build Summary
        run: |
          echo "### 🚀 APK Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "You can download the compiled APK file directly from the **Artifacts** section of this GitHub Actions run." >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name:** PhoneTracker-Debug-APK" >> $GITHUB_STEP_SUMMARY
          echo "- **Package Name:** com.tracker.phonetracker.debug" >> $GITHUB_STEP_SUMMARY
